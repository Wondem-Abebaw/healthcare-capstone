
services:
  # ── Vector Store ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: hc_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Relational DB ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: hc_postgres
    ports:
     - "5433:5432"
      # - "5432:5432"
    environment:
      POSTGRES_DB: healthcare_ai
      POSTGRES_USER: hc_user
      POSTGRES_PASSWORD: hc_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc_user -d healthcare_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object Storage (GCS replacement — S3-compatible) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: hc_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hc_minio_user
      MINIO_ROOT_PASSWORD: hc_minio_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init ─────────────────────────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: hc_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 hc_minio_user hc_minio_secret;
        mc mb --ignore-existing local/medical-documents;
        mc mb --ignore-existing local/fhir-reports;
        mc policy set download local/fhir-reports;
        echo 'Buckets ready.';
      "

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hc_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://hc_user:hc_secret@postgres:5432/healthcare_ai
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=hc_minio_user
      - MINIO_SECRET_KEY=hc_minio_secret
      - MINIO_SECURE=false
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hc_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  minio_data:
